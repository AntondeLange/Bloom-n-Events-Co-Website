name: Website maintenance checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json
      - run: npm ci && npm --prefix astro ci
      - run: npm run check && npm run lint && npm test && npm audit && npm --prefix astro audit
      - run: npm run build && npm run links:check && npm run seo:check && npm run assets:check
      - run: npx playwright install --with-deps chromium
        working-directory: astro
      - run: npx playwright test
        working-directory: astro
